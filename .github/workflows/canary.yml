name: canary

# ONE real run a day against a known-good category, to catch the site
# changing its markup before a user does. THREE pages, so pagination is
# exercised: a one-page canary is how a silent single-page bug survived in a
# sibling repo.
#
# The transport is the Scraping Browser API on a Russian exit — a GitHub
# runner is a datacentre address outside Russia, and avito.ru's firewall
# answers plain clients from a Russian residential exit with HTTP 429 6 times
# of 6 (measured 2026-10-06).
#
# Why the CDP endpoint is BUILT here rather than stored as a secret: it embeds
# a session-pinned proxy, and a session expires (-sessTime-). An endpoint built
# on an expired session answers `500 proxy_error` (measured). So the job mints
# a fresh session from the base credential and builds the endpoint on it, and
# the captcha solver gets that same session — a GeeTest token solved from a
# different exit is rejected (measured).
#
# Needs: secrets TWOCAPTCHA_KEY and AVITO_PROXY (the base gateway login), and
# repository variable AVITO_BROWSER_ACCOUNT_ID (AVITO_BROWSER_PROFILE_ID is
# optional). Without them the job FAILS, naming what is missing: a green
# canary must mean avito.ru was scraped, and a skip that reads green said
# nothing about the site for weeks. A blocked run (exit 3), a run that never
# reached the site (5) or zero rows is red too.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-22.04   # NOT ubuntu-latest: playwright's --with-deps
                            # apt step dies on 24.04.
    env:
      # `secrets` is not available in a job-level `if`; presence goes through
      # job env and is read in each step's `if`.
      HAS_TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY != '' }}
      HAS_AVITO_PROXY: ${{ secrets.AVITO_PROXY != '' }}
      HAS_ACCOUNT_ID: ${{ vars.AVITO_BROWSER_ACCOUNT_ID != '' }}
      # A ready endpoint from the owner (secret AVITO_CDP_ENDPOINT) is used as
      # is; only without one does the job build its own from the account.
      HAS_CDP: ${{ secrets.AVITO_CDP_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require the live-run credentials
        # A GitHub runner is not a Russian residential address, so there is no
        # live path without these. Missing ones fail the job by name.
        run: |
          missing=0
          [ "$HAS_TWOCAPTCHA_KEY" = "true" ] || { echo "::error::secret TWOCAPTCHA_KEY is not set — the canary cannot reach avito.ru"; missing=1; }
          [ "$HAS_AVITO_PROXY" = "true" ] || { echo "::error::secret AVITO_PROXY (the base Russian gateway login) is not set"; missing=1; }
          [ "$HAS_CDP" = "true" ] || [ "$HAS_ACCOUNT_ID" = "true" ] || { echo "::error::neither secret AVITO_CDP_ENDPOINT nor repository variable AVITO_BROWSER_ACCOUNT_ID is set"; missing=1; }
          exit $missing

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt

      - name: Use the given endpoint, on a fresh Russian session
        if: env.HAS_CDP == 'true'
        # The owner's endpoint is re-pointed at a Russian exit: `country-ru`,
        # and a `-proxy-<base64url>` segment carrying a session freshly minted
        # on AVITO_PROXY. The solver gets that SAME session, so a solved
        # captcha leaves from the browser's IP. Both are written to a 0600
        # .env from the environment and never printed.
        env:
          AVITO_CDP_ENDPOINT: ${{ secrets.AVITO_CDP_ENDPOINT }}
          AVITO_PROXY: ${{ secrets.AVITO_PROXY }}
        run: |
          install -m 600 /dev/null .env
          python3 tools/browser_profile_client.py canary-env --session-minutes 60

      - name: Build a fresh endpoint and its matching solver proxy
        if: env.HAS_CDP != 'true'
        # Credentials through the ENVIRONMENT, never argv. The tool writes
        # AVITO_CDP_ENDPOINT and the minted AVITO_PROXY into a 0600 .env and
        # prints both masked.
        env:
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
          AVITO_PROXY: ${{ secrets.AVITO_PROXY }}
        run: |
          install -m 600 /dev/null .env
          python3 tools/browser_profile_client.py connection \
            --account-id "${{ vars.AVITO_BROWSER_ACCOUNT_ID }}" \
            ${{ vars.AVITO_BROWSER_PROFILE_ID != '' && format('--profile-id {0}', vars.AVITO_BROWSER_PROFILE_ID) || '' }} \
            --mint-session --session-minutes 60 --write-env

      - name: Live run
        # AVITO_PROXY is deliberately NOT exported here: an exported variable
        # outranks .env, and the base login would replace the minted session
        # the endpoint was built with.
        #
        # Exit 5 (the Scraping Browser refused the connection, or a page load
        # died on the residential exit) gets ONE retry on a freshly minted
        # session — measured 2026-10-20: the first run after the secret was
        # fixed died with ERR_CONNECTION_RESET, the next one passed. A block
        # (3) or no rows (4) is an answer about the site and is not retried.
        env:
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
          ACCOUNT_ID: ${{ vars.AVITO_BROWSER_ACCOUNT_ID }}
        run: |
          # GitHub runs `run:` under `bash -e`; capture the exit code first.
          set +e
          live() {
            python3 playwright_scraper.py --mode listing \
              --url https://www.avito.ru/moskva/telefony/mobilnye_telefony/apple-ASgBAgICAkS0wA3OqzmwwQ2I_Dc \
              --pages 3 --out canary --format both --verbose
          }
          live; rc=$?
          if [ "$rc" = "5" ]; then
            echo "::warning::the live run exited 5 (connection or page load failed) — one retry on a fresh proxy session"
            if [ "$HAS_CDP" = "true" ]; then
              python3 tools/browser_profile_client.py canary-env --session-minutes 60
            else
              python3 tools/browser_profile_client.py connection --account-id "$ACCOUNT_ID" \
                --mint-session --session-minutes 60 --write-env
            fi
            sleep 30   # a profile stays locked for a while after a dropped connection
            live; rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_ENV"
          set -e

      - name: Assert the data, not just the exit code
        # THE SHIPPED CHECK, not an inline copy (a 2scraper family rule).
        run: |
          echo "exit code from the run: $rc"
          if [ "$rc" != "0" ]; then
            echo "::error::the live run exited $rc (3 blocked, 4 no rows, 5 content never obtained, 6 partial) — the canary did not get a complete scrape"
            exit 1
          fi
          python3 .github/ci_checks.py --run-check --sample-check --output-prefix canary

      - name: Remove the minted credentials
        if: always()
        run: rm -f .env

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-output
          path: |
            canary.json
            canary.csv
            canary*.meta.json
          if-no-files-found: ignore
