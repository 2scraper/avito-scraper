name: tests

# The offline suite only. Nothing here touches avito.ru or 2captcha.com —
# GitHub Actions has no key, and a CI job that hits a live site fails for
# reasons that have nothing to do with the commit. The live side is canary.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor pyproject.toml and the README claim. Claiming it
        # without testing it is how a walrus operator ships and breaks it.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile everything
        run: python -m compileall -q .

      - name: Offline test suite
        run: python smoke_test.py

      - name: Offline test suite, via pytest
        # tests/test_smoke.py wraps the same run, so the pytest entry point
        # cannot silently rot.
        run: |
          pip install pytest
          pytest -q

      - name: Every CLI answers --help
        # THE SHIPPED CHECK, not a copy of it (CLAUDE.md §11). Engine
        # libraries are not installed here, so those entry points report
        # skipped rather than failed.
        run: python3 .github/ci_checks.py --help-check

      - name: Committed sample output is real and matches the schema
        run: python3 .github/ci_checks.py --sample-check

      - name: Config reporter runs with no .env present
        run: python env_config.py

      - name: The built wheel installs and works outside the checkout
        # A flat `py-modules` collection is easy to get wrong, and a wheel
        # that imports in the source tree but not once installed fails only
        # on delivery. Installed into its own venv, exercised from /tmp.
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python -c "
          import sys, output_writer as O, page_flow, product_parser as P, captcha_solver, proxy_forwarder
          problems = []
          if O.SOURCE_DEFAULT != 'avito.ru':
              problems.append('source is %r' % O.SOURCE_DEFAULT)
          u = 'https://www.avito.ru/moskva/telefony'
          if P.page_url(u, 3) != u + '?p=3':
              problems.append('pagination convention did not survive packaging')
          if not page_flow.should_solve('captcha'):
              problems.append('state policy did not survive packaging')
          for p in problems:
              print('::error::' + p)
          print('installed wheel: %d problem(s)' % len(problems))
          sys.exit(1 if problems else 0)"

      - name: No credentials committed
        # THE SHIPPED CHECK — one scanner, shared with the git hooks (§21).
        run: python3 .github/ci_checks.py --secret-check

  engine-smoke:
    # The offline job installs NO engine library on purpose, so every
    # engine-guarded check skips there — and "skipped, engine absent" reads
    # exactly like a pass. This job makes those checks execute.
    #
    # ONE VENV PER ENGINE: the engines' pins are mutually unsatisfiable
    # (pyee, urllib3), and installed together pip may resolve the conflict by
    # picking a release nobody uses (CLAUDE.md §11).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [playwright, puppeteer, selenium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + the ${{ matrix.engine }} engine, in its own venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-${{ matrix.engine }}.txt
          .venv/bin/pip list --format=freeze | grep -iE '^(playwright|pyppeteer|selenium|pyee|urllib3|beautifulsoup4)='

      - name: The requirements file is self-consistent
        run: .venv/bin/pip check

      - name: Offline suite, with ${{ matrix.engine }} actually importable
        # In this job the engine IS installed, so the suite reporting it as
        # absent means a real import error.
        run: |
          set -o pipefail
          .venv/bin/python smoke_test.py | tee smoke.log
          if grep -q "SKIP ${{ matrix.engine }}_scraper (engine library absent)" smoke.log; then
            echo "FAILED: ${{ matrix.engine }}_scraper did not import although ${{ matrix.engine }} is installed."
            exit 1
          fi

      - name: The ${{ matrix.engine }} CLI answers --help
        run: .venv/bin/python ${{ matrix.engine }}_scraper.py --help >/dev/null

  docker:
    # smoke_test checks the COPY list against the import graph without Docker;
    # only a real build proves `playwright install --with-deps chromium`.
    runs-on: ubuntu-22.04   # playwright's --with-deps apt step dies on 24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t avito-scraper:ci .

      - name: The entrypoint runs inside the image
        # CMD is --help: the invocation a missing COPY line fails on.
        run: docker run --rm avito-scraper:ci

      - name: Chromium is actually installed in the image
        run: |
          docker run --rm --entrypoint python3 avito-scraper:ci -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print('chromium', b.version)
              b.close()"

      - name: The image carries no credentials and no test material
        run: |
          set -e
          bad=0
          for f in .env .env.example smoke_test.py tests fixtures .git \
                   sample_output.json sample_output.csv; do
            if docker run --rm --entrypoint sh avito-scraper:ci -c "test -e /app/$f"; then
              echo "::error::$f is inside the image and should not be"
              bad=1
            fi
          done
          test "$bad" = "0"

      - name: Every module the entrypoint imports is inside the image
        run: |
          docker run --rm --entrypoint python3 avito-scraper:ci -c "
          import importlib, sys
          mods = ['browser_bridge','captcha_solver','diff_runs','env_config',
                  'fingerprint_client','output_writer','page_flow',
                  'playwright_scraper','product_parser','proxy_forwarder','proxy_pool']
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as exc:
                  bad.append('%s: %s' % (m, type(exc).__name__))
          for b in bad:
              print('::error::' + b)
          print('importable: %d/%d' % (len(mods) - len(bad), len(mods)))
          sys.exit(1 if bad else 0)"
